[workspace]

[package]
name = "neuron_info"
version = "0.1.0"
edition = "2024"
default-run = "neuron_info"

[dependencies]
candid = "0.10.38"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
ic-agent = "0.49.2"
serde = { version = "1.0.203", features = ["derive"] }
sha2 = "0.10.8"
tokio = { version = "1.38.0", features = ["macros", "rt-multi-thread"] }
