name: CI

on:
  push:
    branches:
      - '**'
      - 'main'

jobs:
  check:
    runs-on: ubuntu-22.04
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # v14
      - name: Run `cargo clippy` and `cargo fmt`
        run: |
          nix develop -i -k HOME -c bash -c "cargo clippy --all-targets && cargo fmt --check"
      # One test thread at a time: every state machine test spins up its own PocketIC replica, and
      # several of those at once exhaust the runner's memory, which kills the server mid-test.
      - name: Run tests
        run: |
          nix develop -i -k HOME -c bash -c "cargo test --locked -- --test-threads=1"
      - name: Compile canisters
        run: ./build.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canisters
          path: artifacts/
          retention-days: 30
